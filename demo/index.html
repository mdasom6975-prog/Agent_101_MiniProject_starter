<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책숲 AI 사서 시연</title>
<style>
  :root {
    --bg: #f6f7f4; --panel: #ffffff; --ink: #1e2a24; --muted: #66726b; --line: #dfe4dd;
    --accent: #2f6f4e; --accent-ink: #ffffff; --user: #e6f0ea; --warn: #b4540a; --bad: #b3261e; --ok: #2f6f4e;
    --sup: #6d4aa8; --rules: #2563a8; --catalog: #1f7a5c; --circ: #b4540a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121815; --panel: #1b2420; --ink: #e8eee9; --muted: #96a39b; --line: #2c3832;
      --accent: #5fb48a; --accent-ink: #0d1612; --user: #243a2f; --warn: #f0a15c; --bad: #ff8a80; --ok: #7bd1a0;
      --sup: #b79af0; --rules: #7db3f0; --catalog: #6fd0ab; --circ: #f0a15c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 20px; margin: 0; }
  header .sub { color: var(--muted); font-size: 14px; }
  header .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  main { display: grid; grid-template-columns: 280px minmax(360px, 1fr) 420px; gap: 14px; padding: 14px 20px; height: calc(100vh - 62px); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 0; display: flex; flex-direction: column; }
  section > h2 { font-size: 14px; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .scroll { overflow: auto; padding: 12px 14px; min-height: 0; flex: 1; }
  .scn { width: 100%; text-align: left; margin-bottom: 8px; padding: 9px 11px; }
  .scn b { display: block; font-size: 15px; }
  .scn small { color: var(--muted); }
  .scn.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
  .notes { border-top: 1px dashed var(--line); padding: 10px 14px; font-size: 14px; display: none; }
  .notes.show { display: block; }
  .notes h3 { margin: 0 0 4px; font-size: 13px; color: var(--accent); }
  .msg { max-width: 92%; padding: 10px 13px; border-radius: 12px; margin-bottom: 10px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); margin-left: auto; }
  .msg.bot { background: var(--bg); border: 1px solid var(--line); }
  .msg.err { background: color-mix(in srgb, var(--bad) 12%, var(--panel)); color: var(--bad); }
  .msg.sys { background: transparent; color: var(--muted); font-size: 14px; border: 1px dashed var(--line); }
  .thinking { color: var(--muted); }
  .thinking::after { content: "…"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  form.ask { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  form.ask input { flex: 1; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .tr { border-left: 4px solid var(--muted); padding: 6px 10px; margin-bottom: 8px; background: var(--bg); border-radius: 0 8px 8px 0; animation: slide .25s ease-out; font-size: 14px; }
  @keyframes slide { from { opacity: 0; transform: translateX(8px); } }
  .tr .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; color: #fff; }
  .tr code { font-weight: 700; }
  .tr .st { margin-left: auto; font-size: 12px; font-weight: 700; }
  .st.success { color: var(--ok); } .st.error, .st.exception { color: var(--bad); }
  .tr .det { color: var(--muted); font-size: 13px; margin-top: 3px; word-break: break-all; }
  .empty { color: var(--muted); font-size: 14px; }
  .members { border-top: 1px solid var(--line); padding: 10px 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mem { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; transition: background .4s; }
  .mem b { font-size: 14px; }
  .mem .fee { font-size: 20px; font-weight: 700; }
  .mem.flash { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.show { display: flex; }
  .modal { background: var(--panel); border-radius: 14px; padding: 22px; width: min(560px, 92vw); border: 2px solid var(--warn); }
  .modal h2 { margin: 0 0 4px; }
  .modal .hint { color: var(--warn); font-weight: 700; font-size: 14px; }
  .modal table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; }
  .modal td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .modal td:first-child { color: var(--muted); width: 90px; }
  .modal textarea, .modal input[type=text] { width: 100%; font: 14px/1.4 ui-monospace, Menlo, monospace; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .modal .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .modal .extra { display: none; margin-top: 8px; }
  .modal .extra.show { display: block; }
  .modal label { font-size: 13px; color: var(--muted); }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; height: auto; } section { min-height: 320px; } }
</style>
</head>
<body>
<header>
  <h1>📚 책숲 AI 사서</h1>
  <span class="sub">supervisor · 규정 RAG · HITL · harness</span>
  <span class="spacer"></span>
  <button id="btn-notes" title="N">발표자 노트 (N)</button>
  <button id="btn-reset">전체 초기화</button>
</header>
<main>
  <section>
    <h2>시연 시나리오</h2>
    <div class="scroll" id="scenarios"></div>
    <div class="notes" id="notes"></div>
  </section>
  <section>
    <h2>대화</h2>
    <div class="scroll" id="chat"></div>
    <form class="ask" id="form">
      <input id="q" autocomplete="off" placeholder="직접 질문해 보세요 (같은 대화로 이어집니다)">
      <button class="primary" id="send" type="submit">보내기</button>
    </form>
  </section>
  <section>
    <h2>실행 추적 (도구 호출이 끝나는 순서)</h2>
    <div class="scroll" id="trace"><div class="empty" id="trace-empty">아직 도구 호출이 없습니다.</div></div>
    <div class="members" id="members"></div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title">🔔 사서 승인 필요</h2>
    <div class="hint" id="m-hint"></div>
    <table id="m-table"></table>
    <div class="row">
      <button class="primary" data-act="approve">승인</button>
      <button data-act="edit">수정 후 실행</button>
      <button data-act="reject">거절</button>
    </div>
    <div class="extra" id="x-edit"><label>수정할 인자 (JSON)</label><textarea id="edit-args" rows="4"></textarea><div class="row"><button class="primary" id="do-edit">수정본으로 실행</button></div></div>
    <div class="extra" id="x-reject"><label>거절 사유</label><input type="text" id="reject-msg" value="증빙 미확인"><div class="row"><button class="primary" id="do-reject">거절 확정</button></div></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const AGENT = { supervisor: ["supervisor", "var(--sup)"], rules_agent: ["rules", "var(--rules)"], catalog_agent: ["catalog", "var(--catalog)"], circulation_agent: ["circulation", "var(--circ)"] };
let seen = 0, busy = false, poll = null, scenarios = [], current = null, lastFees = {}, pending = [];

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "요청에 실패했습니다");
  return data;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }

function addMsg(kind, text) {
  const d = document.createElement("div");
  d.className = "msg " + kind;
  if (kind === "bot") d.innerHTML = rich(text); else d.textContent = text;
  $("#chat").appendChild(d); d.scrollIntoView({ block: "end" });
  return d;
}
function setBusy(v) { busy = v; $("#send").disabled = v; document.querySelectorAll(".scn").forEach(b => b.disabled = v); }

function addTrace(r) {
  $("#trace-empty")?.remove();
  const [label, color] = AGENT[r.agent] || [r.agent, "var(--muted)"];
  const d = document.createElement("div");
  d.className = "tr"; d.style.borderLeftColor = color;
  const time = new Date(r.ts).toLocaleTimeString("ko-KR", { hour12: false });
  d.innerHTML = `<div class="top"><span class="badge" style="background:${color}">${esc(label)}</span><code>${esc(r.tool)}</code>` +
    `<span class="st ${esc(r.status)}">${esc(r.status)}</span></div>` +
    `<div class="det">${esc(time)} · ${esc(r.duration_ms)}ms · 인자 ${esc(JSON.stringify(r.args))}</div>` +
    `<div class="det">→ ${esc(String(r.output).slice(0, 160))}</div>`;
  $("#trace").appendChild(d); d.scrollIntoView({ block: "end" });
}
async function pullTrace() {
  const t = await api("/api/trace?since=" + seen);
  t.rows.forEach(addTrace); seen = t.total;
}
function startPoll() { poll = setInterval(() => pullTrace().catch(() => {}), 500); }
async function stopPoll() { clearInterval(poll); await pullTrace().catch(() => {}); }
async function clearView() {
  $("#chat").innerHTML = ""; $("#trace").innerHTML = '<div class="empty" id="trace-empty">아직 도구 호출이 없습니다.</div>';
  const t = await api("/api/trace?since=999999"); seen = t.total;
}

async function refreshState() {
  const s = await api("/api/state");
  $("#members").innerHTML = s.members.map(m => {
    const changed = m.member_id in lastFees && lastFees[m.member_id] !== m.fee;
    lastFees[m.member_id] = m.fee;
    return `<div class="mem${changed ? " flash" : ""}"><b>${esc(m.member_id)}</b> ${esc(m.name)}<br>` +
      `<span class="fee">${m.fee.toLocaleString()}원</span><br>대출 ${m.current_loans}/${m.loan_limit}권${m.suspended ? " · 정지" : ""}</div>`;
  }).join("");
  setTimeout(() => document.querySelectorAll(".mem.flash").forEach(e => e.classList.remove("flash")), 1800);
}

async function send(question, newThread) {
  if (busy) return;
  setBusy(true); addMsg("user", question);
  const thinking = addMsg("sys thinking", "AI 사서가 처리하는 중");
  startPoll();
  try { handle(await api("/api/ask", { question, new_thread: !!newThread }), thinking); }
  catch (e) { thinking.remove(); addMsg("err", e.message); }
  finally { await stopPoll(); setBusy(false); refreshState().catch(() => {}); }
}
function handle(r, thinking) {
  thinking.remove();
  if (r.pending && r.pending.length) openModal(r.pending); else addMsg("bot", r.answer || "(빈 응답)");
}

function openModal(items) {
  pending = items; const p = items[0];
  const hint = current && current.hitl ? `이 시나리오의 권장 결정: ${current.hitl === "approve" ? "승인" : "거절"}` : "사서로서 결정하세요";
  $("#m-hint").textContent = hint;
  $("#m-table").innerHTML = `<tr><td>도구</td><td><b>${esc(p.name)}</b></td></tr>` +
    Object.entries(p.args).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(typeof v === "string" ? v : JSON.stringify(v))}</td></tr>`).join("") +
    (p.description ? `<tr><td>안내</td><td>${esc(p.description)}</td></tr>` : "");
  $("#edit-args").value = JSON.stringify(p.args, null, 2);
  document.querySelectorAll(".extra").forEach(e => e.classList.remove("show"));
  $("#overlay").classList.add("show");
}
async function decide(decision, label) {
  $("#overlay").classList.remove("show");
  addMsg("sys", `사서 결정: ${label}`);
  setBusy(true);
  const thinking = addMsg("sys thinking", "처리하는 중");
  startPoll();
  try { handle(await api("/api/resume", { decision }), thinking); }
  catch (e) { thinking.remove(); addMsg("err", e.message); }
  finally { await stopPoll(); setBusy(false); refreshState().catch(() => {}); }
}
document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
  const act = b.dataset.act;
  if (act === "approve") return decide({ type: "approve" }, "승인");
  document.querySelectorAll(".extra").forEach(e => e.classList.remove("show"));
  $(act === "edit" ? "#x-edit" : "#x-reject").classList.add("show");
}));
$("#do-reject").addEventListener("click", () => decide({ type: "reject", message: $("#reject-msg").value || "거절" }, "거절"));
$("#do-edit").addEventListener("click", () => {
  try { decide({ type: "edit", args: JSON.parse($("#edit-args").value) }, "수정 후 실행"); }
  catch { alert("JSON 형식이 올바르지 않습니다"); }
});

function renderScenarios() {
  $("#scenarios").innerHTML = "";
  scenarios.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "scn"; b.innerHTML = `<b>${i + 1}. ${esc(s.title)}</b><small>${esc(s.question)}</small>`;
    b.addEventListener("click", async () => {
      if (busy) return;
      current = s; document.querySelectorAll(".scn").forEach(x => x.classList.remove("on")); b.classList.add("on");
      showNotes(); await clearView(); send(s.question, true);
    });
    $("#scenarios").appendChild(b);
  });
}
function showNotes() {
  $("#notes").innerHTML = current ? `<h3>발표자 노트 · ${esc(current.title)}</h3><p>${esc(current.point)}</p><p><b>볼 것:</b> ${esc(current.watch)}</p>` : "";
}
$("#btn-notes").addEventListener("click", () => $("#notes").classList.toggle("show"));
document.addEventListener("keydown", e => { if ((e.key === "n" || e.key === "N") && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") $("#notes").classList.toggle("show"); });
$("#form").addEventListener("submit", e => { e.preventDefault(); const q = $("#q").value.trim(); if (!q) return; $("#q").value = ""; current = null; showNotes(); send(q, false); });
$("#btn-reset").addEventListener("click", async () => {
  if (busy) return;
  await api("/api/reset", {}); lastFees = {}; current = null; showNotes();
  document.querySelectorAll(".scn").forEach(x => x.classList.remove("on"));
  await clearView(); addMsg("sys", "전체 초기화 완료: 연체료·재고·대화·추적이 처음 상태입니다."); refreshState();
});

(async () => { scenarios = await api("/api/scenarios"); renderScenarios(); await clearView(); await refreshState(); })();
</script>
</body>
</html>
